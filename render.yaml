services:
  # --- 1. FastAPI Backend (Production Web Service) ---
  - type: web
    name: rais-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python seed_data.py && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/docs
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: 3.11.9

  # --- 2. React Vite Frontend (Production Static Site) ---
  - type: web
    name: rais-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set in Render to your rais-backend onrender URL (e.g. https://rais-backend.onrender.com)

  # --- 3. FastAPI Backend (Dedicated Staging Web Service) ---
  - type: web
    name: rais-backend-staging
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python seed_data.py && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rais-postgres-staging
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "true"
      - key: PYTHON_VERSION
        value: 3.11.9

  # --- 4. React Vite Frontend (Dedicated Staging Static Site) ---
  - type: web
    name: rais-frontend-staging
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://rais-backend-staging.onrender.com"
      - key: VITE_STAGING_MODE
        value: "true"

databases:
  # --- Dedicated Isolated PostgreSQL Staging Database on Render ---
  - name: rais-postgres-staging
    plan: free
    region: singapore
    databaseName: rais_staging
    user: rais_staging_admin
