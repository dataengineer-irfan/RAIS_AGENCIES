name: Keep Backend & Web Alive (24/7 Free)

on:
  schedule:
    # Ping every 10 minutes to prevent Render free instance sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Cloud Endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging RAIS Backend..."
          curl -sf --max-time 55 https://rais-backend.onrender.com/api/health && echo "Backend: UP" || curl -sf --max-time 55 https://rais-backend.onrender.com/api/docs && echo "Backend: UP (docs)" || echo "Backend: warming up"

      - name: Ping Render Frontend
        run: |
          echo "Pinging RAIS Web Frontend..."
          curl -sf --max-time 30 https://rais-frontend.onrender.com && echo "Frontend: UP" || echo "Frontend: attempted"
