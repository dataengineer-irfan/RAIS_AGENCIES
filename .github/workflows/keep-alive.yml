name: Keep Backend & Web Alive (24/7 Free)

on:
  schedule:
    # Ping every 7 minutes to prevent Render free instance sleep (sleep threshold is 15 mins)
    - cron: '*/7 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Cloud Endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging RAIS Backend..."
          curl -sf --retry 2 --retry-delay 5 --max-time 60 https://rais-backend.onrender.com/health && echo "Backend /health: UP" || \
          curl -sf --retry 2 --retry-delay 5 --max-time 60 https://rais-backend.onrender.com/api/health && echo "Backend /api/health: UP" || \
          curl -sf --retry 2 --retry-delay 5 --max-time 60 https://rais-backend.onrender.com/ && echo "Backend root: UP" || \
          echo "Backend: warming up"

      - name: Ping Render Frontend
        run: |
          echo "Pinging RAIS Web Frontend..."
          curl -sf --retry 2 --retry-delay 5 --max-time 45 https://rais-frontend.onrender.com && echo "Frontend: UP" || echo "Frontend: attempted"

