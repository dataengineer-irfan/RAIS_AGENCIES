name: Nightly Automated Database Backup (30-Day Cloud Vault)

on:
  schedule:
    # Runs at 18:30 UTC every day = 00:00 AM (Midnight) IST
    - cron: '30 18 * * *'
  workflow_dispatch: # Allows manual on-demand trigger from GitHub UI

jobs:
  backup:
    name: Database Backup & Cloud Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Database URL Secret
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::DATABASE_URL secret is not set in GitHub repository secrets!"
            echo "To enable automated cloud backups:"
            echo "1. Go to your GitHub Repository -> Settings -> Secrets and variables -> Actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: DATABASE_URL"
            echo "4. Value: (Your Supabase PostgreSQL Connection String)"
            exit 1
          fi

      - name: Generate IST Timestamp
        id: ist_timestamp
        run: |
          echo "timestamp=$(TZ='Asia/Kolkata' date +'%Y-%m-%d_%H%M%S')" >> $GITHUB_OUTPUT
          echo "date=$(TZ='Asia/Kolkata' date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Execute Full Database Backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/daily_backup.py

      - name: Verify Backup Archive Created
        run: |
          echo "Listing generated backup archives in backups/:"
          ls -lh backups/
          COUNT=$(find backups -type f -name "rais_backup_*.json.gz" | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No backup archive found after running daily_backup.py!"
            exit 1
          fi
          echo "Backup created successfully! Total files: $COUNT"

      - name: Upload Backup to GitHub Cloud Artifacts (30-Day Retention)
        uses: actions/upload-artifact@v4
        with:
          name: rais-db-backup-${{ steps.ist_timestamp.outputs.timestamp }}
          path: backups/*.json.gz
          retention-days: 30
          if-no-files-found: error
          overwrite: true
