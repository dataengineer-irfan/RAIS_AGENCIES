name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build Web App
        env:
          VITE_API_URL: https://rais-backend.onrender.com
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor Assets
        run: |
          cd frontend
          npx cap sync android

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          chmod +x frontend/android/gradlew
          cd frontend/android
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk build-output/RAIS_Agencies.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAIS_Agencies_APK
          path: build-output/RAIS_Agencies.apk
          retention-days: 30

      - name: Publish Latest GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "RAIS Agencies Mobile App (Latest)"
          body: |
            ### 📱 RAIS Agencies Wholesale Mobile App
            - **Depot**: Near Reddies Colony, Rayachoty - 516269
            - **Direct Download**: Tap the `RAIS_Agencies.apk` asset below to install or update on your Android phone.
          files: build-output/RAIS_Agencies.apk

