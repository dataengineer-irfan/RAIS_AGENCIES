name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm install
          npm run build
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x frontend/android/gradlew

      - name: Build Debug APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p build-output
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk build-output/RAIS_Agencies.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAIS-Agencies-Android-APK
          path: build-output/RAIS_Agencies.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-apk
          name: "RAIS Agencies Android App (v1.0.0)"
          body: "Official Android APK for RAIS Agencies Wholesale Depot Management. Download and install directly on your Android phone."
          files: build-output/RAIS_Agencies.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
