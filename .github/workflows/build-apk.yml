name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Target Environment (staging or production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      staging_api_url:
        description: 'Staging API URL (Required for staging builds)'
        required: false
        default: 'https://rais-backend-staging.onrender.com'
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Environment Isolation
        run: |
          python3 -c "
          import sys, urllib.parse
          event_name = '${{ github.event_name }}'
          raw_build_type = '${{ github.event.inputs.build_type }}'.strip().lower()
          
          # On git push to main, ALWAYS build production APK.
          # On workflow_dispatch, respect selected input (default to staging if unspecified).
          if event_name == 'push':
              build_type = 'production'
          else:
              build_type = raw_build_type if raw_build_type else 'staging'
          
          staging_url = '${{ github.event.inputs.staging_api_url || 'https://rais-backend-staging.onrender.com' }}'.strip()
          
          if build_type == 'staging':
              if not staging_url:
                  print('::error::FATAL: Staging API URL must be explicitly provided.')
                  sys.exit(1)
              parsed = urllib.parse.urlparse(staging_url)
              if not parsed.scheme or not parsed.netloc:
                  print(f'::error::FATAL: Malformed Staging URL: {staging_url}')
                  sys.exit(1)
              if parsed.scheme.lower() != 'https':
                  print(f'::error::FATAL SAFETY GUARD: Staging API URL must strictly use HTTPS scheme. Got: {parsed.scheme}')
                  sys.exit(1)
              hostname = (parsed.hostname or '').lower()
              if not hostname:
                  print(f'::error::FATAL: Hostname missing in URL: {staging_url}')
                  sys.exit(1)
              if hostname == 'rais-backend.onrender.com' or hostname.endswith('.rais-backend.onrender.com'):
                  print(f'::error::FATAL SAFETY GUARD: Staging build cannot target production host {hostname}.')
                  sys.exit(1)
              if parsed.port and parsed.port != 443:
                  print(f'::error::FATAL SAFETY GUARD: Non-standard HTTPS port {parsed.port} is rejected.')
                  sys.exit(1)
              print(f'Staging validation passed: targeting approved secure host {hostname}')
          else:
              print(f'Production build confirmed for event: {event_name}')
          "
          EVENT_NAME="${{ github.event_name }}"
          RAW_BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ "$EVENT_NAME" = "push" ] || [ "$RAW_BUILD_TYPE" = "production" ]; then
            echo "TARGET_API_URL=https://rais-backend.onrender.com" >> $GITHUB_ENV
            echo "IS_STAGING=false" >> $GITHUB_ENV
            echo "OUTPUT_APK_NAME=RAIS_Agencies.apk" >> $GITHUB_ENV
          else
            STAGING_URL="${{ github.event.inputs.staging_api_url || 'https://rais-backend-staging.onrender.com' }}"
            echo "TARGET_API_URL=$STAGING_URL" >> $GITHUB_ENV
            echo "IS_STAGING=true" >> $GITHUB_ENV
            echo "OUTPUT_APK_NAME=RAIS_Agencies_STAGING_DEBUG.apk" >> $GITHUB_ENV
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build Web App
        env:
          VITE_API_URL: ${{ env.TARGET_API_URL }}
          VITE_STAGING_MODE: ${{ env.IS_STAGING }}
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor Assets
        run: |
          cd frontend
          npx cap sync android

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          chmod +x frontend/android/gradlew
          cd frontend/android
          ./gradlew clean
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output & Checksum
        run: |
          mkdir -p build-output
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk "build-output/${{ env.OUTPUT_APK_NAME }}"
          echo "Calculating SHA-256 Checksum for ${{ env.OUTPUT_APK_NAME }}..."
          sha256sum "build-output/${{ env.OUTPUT_APK_NAME }}" | tee "build-output/${{ env.OUTPUT_APK_NAME }}.sha256"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_APK_NAME }}
          path: |
            build-output/${{ env.OUTPUT_APK_NAME }}
            build-output/${{ env.OUTPUT_APK_NAME }}.sha256
          retention-days: 30

      - name: Publish Production GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' && env.IS_STAGING == 'false'
        with:
          tag_name: latest
          name: "RAIS Agencies Mobile App (Production)"
          body: |
            ### 📱 RAIS Agencies Wholesale Mobile App (Production)
            - **Depot**: Near Reddies Colony, Rayachoty - 516269
            - **Direct Download**: Tap the `RAIS_Agencies.apk` asset below to install or update on your Android phone.
          files: build-output/RAIS_Agencies.apk
          overwrite_files: true

